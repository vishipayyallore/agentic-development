name: Repository Structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Validate Learning Repository Layout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files and directories
        shell: bash
        run: |
          set -euo pipefail

          required_files=(README.md LICENSE .gitignore)
          required_directories=(docs notebooks scripts/ps scripts/py src)

          for path in "${required_files[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

          for path in "${required_directories[@]}"; do
            test -d "$path" || { echo "Missing required directory: $path"; exit 1; }
          done

          echo 'Repository structure is valid.'